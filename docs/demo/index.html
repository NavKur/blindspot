Var('T')\n\n__all__ = ('LRUCache', 'freeze', 'with_typehint')\n\n\ndef with_typehint(baseclass: type[T]):\n    \"\"\"\n    Add type hints from a specified class to a base class:\n\n    >>> class Foo(with_typehint(Bar)):\n    ...     pass\n\n    This would add type hints from class ``Bar`` to class ``Foo``.\n\n    Note that while PyCharm and Pyright (for VS Code) understand this pattern,\n    MyPy does not. For that reason TinyDB has a MyPy plugin in\n    ``mypy_plugin.py`` that adds support for this pattern.\n    \"\"\"\n    if TYPE_CHECKING:\n        # In the case of type checking: pretend that the target class inherits\n        # from the specified base class\n        return baseclass\n\n    # Otherwise: just inherit from `object` like a regular Python class\n    return object\n\n\nclass LRUCache(abc.MutableMapping, Generic[K, V]):\n    \"\"\"\n    A least-recently used (LRU) cache with a fixed cache size.\n\n    This class acts as a dictionary but has a limited size. If the number of\n    entries in the cache exceeds the cache size, the least-recently accessed\n    entry will be discarded.\n\n    This is implemented using an ``OrderedDict``. On every access the accessed\n    entry is moved to the front by re-inserting it into the ``OrderedDict``.\n    When adding an entry and the cache size is exceeded, the last entry will\n    be discarded.\n    \"\"\"\n\n    def __init__(self, capacity=None) -> None:\n        self.capacity = capacity\n        self.cache: OrderedDict[K, V] = OrderedDict()\n\n    @property\n    def lru(self) -> list[K]:\n        return list(self.cache.keys())\n\n    @property\n    def length(self) -> int:\n        return len(self.cache)\n\n    def clear(self) -> None:\n        self.cache.clear()\n\n    def __len__(self) -> int:\n        return self.length\n\n    def __contains__(self, key: object) -> bool:\n        return key in self.cache\n\n    def __setitem__(self, key: K, value: V) -> None:\n        self.set(key, value)\n\n    def __delitem__(self, key: K) -> None:\n        del self.cache[key]\n\n    def __getitem__(self, key) -> V:\n        value = self.get(key)\n        if value is None:\n            raise KeyError(key)\n\n        return value\n\n    def __iter__(self) -> Iterator[K]:\n        return iter(self.cache)\n\n    def get(self, key: K, default: Optional[D] = None) -> Optional[Union[V, D]]:\n        value = self.cache.get(key)\n\n        if value is not None:\n            self.cache.move_to_end(key, last=True)\n\n            return value\n\n        return default\n\n    def set(self, key: K, value: V):\n        if key in self.cache:\n            self.cache[key] = value\n            self.cache.move_to_end(key, last=True)\n        else:\n            self.cache[key] = value\n\n            # Check, if the cache is full and we have to remove old items\n            # If the queue is of unlimited size, self.capacity is NaN and\n            # x > NaN is always False in Python and the cache won't be cleared.\n            if self.capacity is not None and self.length > self.capacity:\n                self.cache.popitem(last=False)\n\n\nclass FrozenDict(dict):\n    \"\"\"\n    An immutable dictionary.\n\n    This is used to generate stable hashes for queries that contain dicts.\n    Usually, Python dicts are not hashable because they are mutable. This\n    class removes the mutability and implements the ``__hash__`` method.\n    \"\"\"\n\n    def __hash__(self):\n        # Calculate the has by hashing a tuple of all dict items\n        return hash(tuple(sorted(self.items())))\n\n    def _immutable(self, *args, **kws):\n        raise TypeError('object is immutable')\n\n    # Disable write access to the dict\n    __setitem__ = _immutable\n    __delitem__ = _immutable\n    clear = _immutable\n    setdefault = _immutable  # type: ignore\n    popitem = _immutable\n\n    def update(self, e=None, **f):\n        raise TypeError('object is immutable')\n\n    def pop(self, k, d=None):\n        raise TypeError('object is immutable')\n\n\ndef freeze(obj):\n    \"\"\"\n    Freeze an object by making it immutable and thus hashable.\n    \"\"\"\n    if isinstance(obj, dict):\n        # Transform dicts into ``FrozenDict``s\n        return FrozenDict((k, freeze(v)) for k, v in obj.items())\n    elif isinstance(obj, list):\n        # Transform lists into tuples\n        return tuple(freeze(el) for el in obj)\n    elif isinstance(obj, tuple):\n        # Freeze tuple elements too, so a nested dict/list inside an\n        # already-tuple arg (e.g. Query.test's *args) is still hashable\n        return tuple(freeze(el) for el in obj)\n    elif isinstance(obj, set):\n        # Transform sets into ``frozenset``s\n        return frozenset(obj)\n    else:\n        # Don't handle all other objects\n        return obj\n","README.rst":".. image:: https://raw.githubusercontent.com/msiemens/tinydb/master/artwork/logo.png\n    :height: 150px\n\n|Build Status| |Coverage| |Version|\n\nQuick Links\n***********\n\n- `Example Code`_\n- `Supported Python Versions`_\n- `Documentation <http://tinydb.readthedocs.org/>`_\n- `Changelog <https://tinydb.readthedocs.io/en/latest/changelog.html>`_\n- `Extensions <https://tinydb.readthedocs.io/en/latest/extensions.html>`_\n- `Contributing`_\n\nIntroduction\n************\n\nTinyDB is a lightweight document oriented database optimized for your happiness :)\nIt's written in pure Python and has no external dependencies. The target are\nsmall apps that would be blown away by a SQL-DB or an external database server.\n\nTinyDB is:\n\n- **tiny:** The current source code has 1800 lines of code (with about 40%\n  documentation) and 1600 lines tests.\n\n- **document oriented:** Like MongoDB_, you can store any document\n  (represented as ``dict``) in TinyDB.\n\n- **optimized for your happiness:** TinyDB is designed to be simple and\n  fun to use by providing a simple and clean API.\n\n- **written in pure Python:** TinyDB neither needs an external server (as\n  e.g. `PyMongo <https://pymongo.readthedocs.io/en/stable/>`_) nor any dependencies\n  from PyPI.\n\n- **works on Python 3.8+ and PyPy3:** TinyDB works on all modern versions of Python\n  and PyPy.\n\n- **powerfully extensible:** You can easily extend TinyDB by writing new\n  storages or modify the behaviour of storages with Middlewares.\n\n- **100% test coverage:** No explanation needed.\n\nTo dive straight into all the details, head over to the `TinyDB docs\n<https://tinydb.readthedocs.io/>`_. You can also discuss everything related\nto TinyDB like general development, extensions or showcase your TinyDB-based\nprojects on the `discussion forum <http://forum.m-siemens.de/.>`_.\n\nSupported Python Versions\n*************************\n\nTinyDB has been tested with Python 3.8 - 3.13 and PyPy3.\n\nProject Status\n**************\n\nThis project is in maintenance mode. It has reached a mature, stable state\nwhere significant new features or architectural changes are not planned. That\nsaid, there will still be releases for bugfixes or features contributed by\nthe community. Read more about what this means in particular\n`here <https://github.com/msiemens/tinydb/discussions/572>`_.\n\nExample Code\n************\n\n.. code-block:: python\n\n    >>> from tinydb import TinyDB, Query\n    >>> db = TinyDB('/path/to/db.json')\n    >>> db.insert({'int': 1, 'char': 'a'})\n    >>> db.insert({'int': 1, 'char': 'b'})\n\nQuery Language\n==============\n\n.. code-block:: python\n\n    >>> User = Query()\n    >>> # Search for a field value\n    >>> db.search(User.name == 'John')\n    [{'name': 'John', 'age': 22}, {'name': 'John', 'age': 37}]\n\n    >>> # Combine two queries with logical and\n    >>> db.search((User.name == 'John') & (User.age <= 30))\n    [{'name': 'John', 'age': 22}]\n\n    >>> # Combine two queries with logical or\n    >>> db.search((User.name == 'John') | (User.name == 'Bob'))\n    [{'name': 'John', 'age': 22}, {'name': 'John', 'age': 37}, {'name': 'Bob', 'age': 42}]\n\n    >>> # Negate a query with logical not\n    >>> db.search(~(User.name == 'John'))\n    [{'name': 'Megan', 'age': 27}, {'name': 'Bob', 'age': 42}]\n\n    >>> # Apply transformation to field with `map`\n    >>> db.search((User.age.map(lambda x: x + x) == 44))\n    >>> [{'name': 'John', 'age': 22}]\n\n    >>> # More possible comparisons:  !=  <  >  <=  >=\n    >>> # More possible checks: where(...).matches(regex), where(...).test(your_test_func)\n\nTables\n======\n\n.. code-block:: python\n\n    >>> table = db.table('name')\n    >>> table.insert({'value': True})\n    >>> table.all()\n    [{'value': True}]\n\nUsing Middlewares\n=================\n\n.. code-block:: python\n\n    >>> from tinydb.storages import JSONStorage\n    >>> from tinydb.middlewares import CachingMiddleware\n    >>> db = TinyDB('/path/to/db.json', storage=CachingMiddleware(JSONStorage))\n\n\nContributing\n************\n\nWhether reporting bugs, discussing improvements and new ideas or writing\nextensions: Contributions to TinyDB are welcome! Here's how to get started:\n\n1. Check for open issues or open a fresh issue to start a discussion around\n   a feature idea or a bug\n2. Fork `the repository <https://github.com/msiemens/tinydb/>`_ on Github,\n   create a new branch off the `master` branch and start making your changes\n   (known as `GitHub Flow <https://docs.github.com/en/get-started/using-github/github-flow>`_)\n3. Write a test which shows that the bug was fixed or that the feature works\n   as expected\n4. Send a pull request and bug the maintainer until it gets merged and\n   published ☺\n\n.. |Build Status| image:: https://img.shields.io/azure-devops/build/msiemens/3e5baa75-12ec-43ac-9728-89823ee8c7e2/2.svg?style=flat-square\n   :target: https://dev.azure.com/msiemens/github/_build?definitionId=2\n.. |Coverage| image:: http://img.shields.io/coveralls/msiemens/tinydb.svg?style=flat-square\n   :target: https://coveralls.io/r/msiemens/tinydb\n.. |Version| image:: http://img.shields.io/pypi/v/tinydb.svg?style=flat-square\n   :target: https://pypi.python.org/pypi/tinydb/\n.. _Buzhug: http://buzhug.sourceforge.net/\n.. _CodernityDB: https://github.com/perchouli/codernitydb\n.. _MongoDB: http://mongodb.org/\n","pyproject.toml":"[project]\nname = \"tinydb\"\nversion = \"4.9.0\"\ndescription = \"TinyDB is a tiny, document oriented database optimized for your happiness :)\"\nauthors = [{ name = \"Markus Siemens\", email = \"markus@m-siemens.de\" }]\nrequires-python = \">=3.10,<4\"\nreadme = \"README.rst\"\nlicense = \"MIT\"\nkeywords = [\n    \"database\",\n    \"nosql\",\n]\nclassifiers = [\n    \"Development Status :: 5 - Production/Stable\",\n    \"Intended Audience :: Developers\",\n    \"Intended Audience :: System Administrators\",\n    \"License :: OSI Approved :: MIT License\",\n    \"Topic :: Database\",\n    \"Topic :: Database :: Database Engines/Servers\",\n    \"Topic :: Utilities\",\n    \"Programming Language :: Python :: 3\",\n    \"Programming Language :: Python :: 3.10\",\n    \"Programming Language :: Python :: 3.11\",\n    \"Programming Language :: Python :: 3.12\",\n    \"Programming Language :: Python :: 3.13\",\n    \"Programming Language :: Python :: 3.14\",\n    \"Programming Language :: Python :: Implementation :: CPython\",\n    \"Programming Language :: Python :: Implementation :: PyPy\",\n    \"Operating System :: OS Independent\",\n    \"Typing :: Typed\",\n]\n\n[project.urls]\nHomepage = \"https://github.com/msiemens/tinydb\"\nDocumentation = \"https://tinydb.readthedocs.org/\"\nChangelog = \"https://tinydb.readthedocs.io/en/latest/changelog.html\"\nIssues = \"https://github.com/msiemens/tinydb/issues\"\n\n[dependency-groups]\ndev = [\n    \"pytest~=9.0\",\n    \"pytest-pycodestyle~=2.3\",\n    \"pytest-cov~=7.0\",\n    \"pycodestyle~=2.10\",\n    \"sphinx~=8.1\",\n    \"coveralls~=4.0\",\n    \"pyyaml~=6.0\",\n    \"pytest-mypy~=1.0 ; platform_python_implementation != 'PyPy'\",\n    \"types-PyYAML~=6.0\",\n]\n\n[tool.hatch.build.targets.sdist]\ninclude = [\n    \"tinydb\",\n    \"tests\",\n]\n\n[tool.hatch.build.targets.wheel]\ninclude = [\"tinydb\"]\n\n[build-system]\nrequires = [\"hatchling\"]\nbuild-backend = \"hatchling.build\"\n","tinydb/mypy_plugin.py":"from collections.abc import Callable\nfrom typing import TypeVar, Optional\n\nfrom mypy.nodes import NameExpr\nfrom mypy.options import Options\nfrom mypy.plugin import Plugin, DynamicClassDefContext\n\nT = TypeVar('T')\nCB = Optional[Callable[[T], None]]\nDynamicClassDef = DynamicClassDefContext\n\n\nclass TinyDBPlugin(Plugin):\n    def __init__(self, options: Options):\n        super().__init__(options)\n\n        self.named_placeholders: dict[str, str] = {}\n\n    def get_dynamic_class_hook(self, fullname: str) -> CB[DynamicClassDef]:\n        if fullname == 'tinydb.utils.with_typehint':\n            def hook(ctx: DynamicClassDefContext):\n                klass = ctx.call.args[0]\n                assert isinstance(klass, NameExpr)\n\n                type_name = klass.fullname\n                assert type_name is not None\n\n                qualified = self.lookup_fully_qualified(type_name)\n                assert qualified is not None\n\n                ctx.api.add_symbol_table_node(ctx.name, qualified)\n\n            return hook\n\n        return None\n\n\ndef plugin(_version: str):\n    return TinyDBPlugin\n","tinydb/version.py":"__version__ = '4.9.0'\n"},"suggestedByRole":{"new":["Where does data actually get written to disk?","How do queries work?","What should I read first?"],"reviewing":["Which parts of this code does Bob understand least?","What behaviour is easy to get wrong in Table.update()?","Which tests cover the storage layer?"],"releasing":["What changed recently in areas where Bob was wrong before?","Which functions have no tests?","What should the release notes mention?"]},"roleLabels":{"new":"New to the repo","reviewing":"Reviewing a change","releasing":"About to release"},"repoUrl":"https://github.com/NavKur/blindspot"};</script>
<script>window.PANEL_HTML = "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Bob Readiness</title>\n<style>/* Values of the VS Code theme variables the panel uses, from the Dark Modern theme, so the\n   plugin's own CSS renders outside VS Code. */\n:root {\n  --vscode-font-family: \"IBM Plex Sans\", -apple-system, BlinkMacSystemFont, \"Segoe UI\", system-ui, sans-serif;\n  --vscode-editor-font-family: \"IBM Plex Mono\", Menlo, Monaco, \"Courier New\", monospace;\n  --vscode-foreground: #cccccc;\n  --vscode-descriptionForeground: #9d9d9d;\n  --vscode-editor-background: #1f1f1f;\n  --vscode-sideBar-background: #181818;\n  --vscode-sideBarTitle-foreground: #cccccc;\n  --vscode-panel-border: #2b2b2b;\n  --vscode-widget-border: #313131;\n  --vscode-contrastBorder: transparent;\n  --vscode-editorWidget-background: #202020;\n  --vscode-focusBorder: #0078d4;\n  --vscode-textLink-foreground: #4daafc;\n  --vscode-textCodeBlock-background: #2b2b2b;\n  --vscode-button-background: #0078d4;\n  --vscode-button-foreground: #ffffff;\n  --vscode-button-border: transparent;\n  --vscode-button-hoverBackground: #026ec1;\n  --vscode-button-secondaryBackground: #313131;\n  --vscode-button-secondaryForeground: #cccccc;\n  --vscode-button-secondaryHoverBackground: #3c3c3c;\n  --vscode-input-background: #313131;\n  --vscode-input-foreground: #cccccc;\n  --vscode-input-border: #3c3c3c;\n  --vscode-dropdown-background: #313131;\n  --vscode-dropdown-foreground: #cccccc;\n  --vscode-dropdown-border: #3c3c3c;\n  --vscode-list-hoverBackground: #2a2d2e;\n  --vscode-progressBar-background: #0078d4;\n}\n</style>\n<script>\nwindow.acquireVsCodeApi = function () {\n  return { postMessage: function (m) { window.parent.postMessage({ source: \"bob-readiness-panel\", message: m }, \"*\"); } };\n};\n<\/script>\n<style nonce=\"demo\">\n:root {\n  --red: #fa4d56; --blue: #4589ff; --yellow: #f1c21b; --green: #24a148;\n  --red-bg: rgba(250,77,86,0.22); --blue-bg: rgba(69,137,255,0.28); --green-bg: rgba(36,161,72,0.28);\n}\n* { box-sizing: border-box; }\nhtml, body { height: 100%; margin: 0; padding: 0; }\nbody {\n  font-family: \"IBM Plex Sans\", var(--vscode-font-family), system-ui, sans-serif;\n  font-size: 13px; line-height: 1.45;\n  color: var(--vscode-foreground); background: var(--vscode-sideBar-background, var(--vscode-editor-background));\n  display: flex; flex-direction: column; height: 100vh; overflow: hidden;\n}\nbutton, input { font-family: inherit; font-size: 13px; border-radius: 0; }\nbutton { cursor: pointer; }\nbutton:disabled { cursor: default; opacity: 0.5; }\na { color: var(--vscode-textLink-foreground); }\n.mono { font-family: \"IBM Plex Mono\", var(--vscode-editor-font-family), monospace; font-size: 12px; }\n.muted { color: var(--vscode-descriptionForeground); }\n\nheader { padding: 10px 12px 0; border-bottom: 1px solid var(--vscode-panel-border, var(--vscode-widget-border, transparent)); }\n.title { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--vscode-sideBarTitle-foreground, var(--vscode-foreground)); }\n.stats { display: flex; gap: 18px; margin: 10px 0 8px; }\n.stat b { display: block; font-size: 18px; font-weight: 400; line-height: 1.1; }\n.stat span { font-size: 11px; color: var(--vscode-descriptionForeground); }\n.tabs { display: flex; gap: 0; margin: 0 -12px; padding: 0 4px; overflow-x: auto; }\n.tab { background: none; border: none; border-bottom: 2px solid transparent; color: var(--vscode-descriptionForeground); padding: 6px 8px; }\n.tab.active { color: var(--vscode-foreground); border-bottom-color: var(--vscode-focusBorder, var(--blue)); }\n.tab:hover { color: var(--vscode-foreground); }\n\nmain { flex: 1; overflow-y: auto; padding: 10px 12px; }\n.empty { padding: 20px 4px; color: var(--vscode-descriptionForeground); }\nh3 { font-size: 13px; margin: 14px 0 6px; font-weight: 600; }\nh3:first-child { margin-top: 0; }\n\n.row { display: flex; gap: 10px; border: 1px solid var(--vscode-panel-border, var(--vscode-widget-border, #3c3c3c)); padding: 10px; margin-bottom: 8px; background: var(--vscode-editorWidget-background, transparent); }\n.row.disabled { opacity: 0.85; }\n.row input[type=checkbox] { margin: 3px 0 0; flex: none; width: 15px; height: 15px; }\n.row .body { flex: 1; min-width: 0; }\n.row .head { display: flex; align-items: baseline; gap: 6px; }\n.sev { display: inline-block; width: 8px; height: 8px; flex: none; position: relative; top: -1px; }\n.sev.high { background: var(--red); } .sev.medium { background: var(--yellow); } .sev.low { background: var(--blue); }\n.row .ttl { font-weight: 600; }\n.row .loc { margin: 2px 0; }\n.row .loc a { color: var(--blue); text-decoration: none; cursor: pointer; }\n.row .loc a:hover { text-decoration: underline; }\n.row .fn { margin-left: 8px; color: var(--vscode-descriptionForeground); }\n.row .detail { margin: 2px 0; }\n.row .rec { margin: 2px 0; color: var(--vscode-descriptionForeground); }\n.gate { display: block; margin-top: 8px; padding: 3px 8px; font-size: 12px; color: var(--vscode-foreground); }\n.gate.yes { background: var(--green-bg); } .gate.with_notes { background: var(--blue-bg); } .gate.no { background: var(--red-bg); }\n\nfooter { border-top: 1px solid var(--vscode-panel-border, var(--vscode-widget-border, transparent)); padding: 10px 12px; }\n.totals { display: flex; justify-content: space-between; margin-bottom: 8px; }\n.btn { width: 100%; padding: 8px 12px; border: 1px solid var(--vscode-button-border, transparent); background: var(--vscode-button-background); color: var(--vscode-button-foreground); }\n.btn:hover:not(:disabled) { background: var(--vscode-button-hoverBackground); }\n.btn.secondary { background: var(--vscode-button-secondaryBackground, transparent); color: var(--vscode-button-secondaryForeground, var(--vscode-foreground)); border-color: var(--vscode-button-border, var(--vscode-contrastBorder, #6f6f6f)); }\n.btn.secondary:hover:not(:disabled) { background: var(--vscode-button-secondaryHoverBackground); }\n.btn + .btn { margin-top: 8px; }\n.btns { display: flex; gap: 8px; } .btns .btn { flex: 1; margin: 0; }\n\npre.code { background: var(--vscode-textCodeBlock-background, rgba(127,127,127,0.15)); padding: 10px; margin: 0 0 8px; white-space: pre-wrap; }\n.card { border: 1px solid var(--vscode-panel-border, var(--vscode-widget-border, #3c3c3c)); padding: 8px 10px; margin-bottom: 8px; cursor: pointer; }\n.card:hover { background: var(--vscode-list-hoverBackground); }\n.card b { display: block; font-weight: 600; }\n\n.kv { display: flex; justify-content: space-between; padding: 3px 0; }\n.bar { height: 6px; background: var(--vscode-progressBar-background, #3c3c3c); opacity: 1; margin: 4px 0 10px; }\n.bar > i { display: block; height: 100%; }\n.verdict { border: 1px solid var(--yellow); padding: 10px; margin: 10px 0; }\n.verdict.ready { border-color: var(--green); } .verdict.not-ready { border-color: var(--red); }\n.verdict b { display: block; margin-bottom: 4px; }\n.notes p { margin: 4px 0; }\n\n.chat { display: flex; flex-direction: column; gap: 8px; }\n.msg { max-width: 92%; padding: 8px 10px; }\n.msg.q { align-self: flex-end; background: var(--vscode-button-background); color: var(--vscode-button-foreground); }\n.msg.a { align-self: flex-start; background: var(--vscode-textCodeBlock-background, rgba(127,127,127,0.15)); }\n.msg .cost { display: block; margin-top: 4px; font-size: 11px; color: var(--vscode-descriptionForeground); }\n.msg.a .cost { color: var(--vscode-descriptionForeground); }\n.suggest { margin-top: 8px; }\n.ask { display: flex; gap: 6px; margin-top: 8px; }\n.ask input { flex: 1; padding: 6px 8px; background: var(--vscode-input-background); color: var(--vscode-input-foreground); border: 1px solid var(--vscode-input-border, transparent); }\n.ask input:focus { outline: 1px solid var(--vscode-focusBorder); }\n.notice { font-size: 11px; color: var(--vscode-descriptionForeground); margin-top: 6px; }\n\n.result h2 { font-size: 15px; margin: 0 0 10px; font-weight: 600; }\n\n.banner { background: var(--yellow); color: #161616; padding: 6px 10px; font-weight: 600; margin-bottom: 10px; }\n.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px 14px; margin: 6px 0 10px; }\n.grid .stat b { font-size: 16px; }\n.heat { display: inline-block; width: 10px; height: 10px; flex: none; position: relative; top: 1px; margin-right: 6px; }\n.h0 { background: #24a148; } .h1 { background: #8fd14f; } .h2 { background: #f1c21b; } .h3 { background: #ff832b; } .h4 { background: #da1e28; }\n.hred { background: var(--red); outline: 2px solid var(--red); outline-offset: 1px; }\n.mod { border: 1px solid var(--vscode-panel-border, var(--vscode-widget-border, #3c3c3c)); padding: 8px 10px; margin-bottom: 6px; }\n.mod .top { display: flex; align-items: center; gap: 6px; }\n.mod .top a { cursor: pointer; color: var(--blue); text-decoration: none; font-weight: 600; }\n.mod .top a:hover { text-decoration: underline; }\n.mod .nums { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 4px; color: var(--vscode-descriptionForeground); font-size: 12px; }\n.mod .reasons { color: var(--red); font-size: 12px; margin-top: 3px; }\n.tag { display: inline-block; font-size: 11px; padding: 0 6px; margin-left: auto; }\n.tag.red { background: var(--red-bg); } .tag.few { background: rgba(241,194,27,0.28); }\nsvg.spark { vertical-align: middle; margin-left: auto; }\nsvg.spark polyline, svg.chart polyline { fill: none; stroke-width: 1.5; }\n.chart-wrap { margin: 6px 0 10px; }\n.legend { display: flex; gap: 12px; font-size: 11px; color: var(--vscode-descriptionForeground); margin-top: 2px; }\n.legend i { display: inline-block; width: 10px; height: 3px; vertical-align: middle; margin-right: 4px; }\n.c0 { stroke: #8a3ffc; background: #8a3ffc; } .c1 { stroke: #4589ff; background: #4589ff; } .c2 { stroke: #24a148; background: #24a148; } .c3 { stroke: #ff832b; background: #ff832b; }\ntable.cmp { width: 100%; border-collapse: collapse; font-size: 12px; }\ntable.cmp th, table.cmp td { text-align: left; padding: 3px 4px; border-bottom: 1px solid var(--vscode-panel-border, var(--vscode-widget-border, #3c3c3c)); }\ntable.cmp td.up { color: var(--green); } table.cmp td.down { color: var(--red); }\n.selects { display: flex; gap: 6px; align-items: center; margin: 6px 0; }\nselect { font-family: inherit; font-size: 12px; background: var(--vscode-dropdown-background); color: var(--vscode-dropdown-foreground); border: 1px solid var(--vscode-dropdown-border, transparent); padding: 3px; }\n.bins { display: flex; gap: 4px; align-items: flex-end; height: 50px; margin: 4px 0; }\n.bins .bin { flex: 1; text-align: center; font-size: 10px; color: var(--vscode-descriptionForeground); display: flex; flex-direction: column; justify-content: flex-end; height: 100%; }\n.bins .bin i { display: block; background: var(--blue); min-height: 1px; }\n.bins .bin.empty i { background: transparent; border-top: 1px dashed var(--vscode-descriptionForeground); }\n.hm { overflow-x: auto; }\n.hm table { border-collapse: separate; border-spacing: 3px; }\n.hm td, .hm th { padding: 0; font-size: 11px; color: var(--vscode-descriptionForeground); font-weight: normal; white-space: nowrap; }\n.hm th.col { writing-mode: vertical-rl; transform: rotate(180deg); text-align: left; padding: 2px 0; }\n.hm td.lbl { padding-right: 8px; text-align: right; }\n.hm td.lbl a { color: var(--vscode-foreground); text-decoration: none; cursor: pointer; }\n.hm td.lbl a:hover { text-decoration: underline; }\n.cell { display: inline-block; width: 13px; height: 13px; border-radius: 2px; vertical-align: middle; cursor: pointer; }\n.cell.none { background: var(--vscode-panel-border, #3c3c3c); opacity: 0.35; cursor: default; }\n.cell.b0 { background: #24a148; } .cell.b1 { background: #8fd14f; } .cell.b2 { background: #f1c21b; } .cell.b3 { background: #ff832b; } .cell.b4 { background: #da1e28; }\n.cell.red { box-shadow: 0 0 0 2px var(--red); }\n.cell:hover { outline: 2px solid var(--vscode-focusBorder); }\n.cells { display: flex; flex-wrap: wrap; gap: 3px; }\n.hmrow { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 6px; }\n.hmrow .lbl { width: 120px; flex: none; text-align: right; font-size: 11px; color: var(--vscode-descriptionForeground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n.hmrow .lbl a { color: var(--vscode-foreground); text-decoration: none; cursor: pointer; }\n.hmrow .lbl a:hover { text-decoration: underline; }\n.hmrow .lbl small { display: block; }\n.legend2 { display: flex; gap: 8px; align-items: center; font-size: 11px; color: var(--vscode-descriptionForeground); margin: 4px 0 10px; flex-wrap: wrap; }\n.legend2 .cell { cursor: default; }\n.counts { display: flex; gap: 14px; margin: 6px 0; }\n.roles { display: flex; gap: 4px; margin: 6px 0; flex-wrap: wrap; }\n.roles button { background: none; border: 1px solid var(--vscode-panel-border, var(--vscode-widget-border, #6f6f6f)); color: var(--vscode-descriptionForeground); padding: 2px 8px; font-size: 12px; }\n.roles button.active { color: var(--vscode-foreground); border-color: var(--vscode-focusBorder, var(--blue)); }\npre.out { background: var(--vscode-textCodeBlock-background, rgba(127,127,127,0.15)); padding: 8px; font-size: 11px; white-space: pre-wrap; max-height: 200px; overflow: auto; margin: 6px 0; }\n.files .kv span:last-child { font-family: var(--vscode-editor-font-family), monospace; font-size: 12px; }\n.files .kv a { cursor: pointer; text-decoration: none; color: var(--vscode-foreground); }\n.files .kv a:hover { text-decoration: underline; }\n.plus { color: var(--green); } .minus { color: var(--red); margin-left: 6px; }\n.tests { border: 1px solid var(--green); padding: 8px 10px; margin: 10px 0; }\n.tests.fail { border-color: var(--red); }\n.tests.running { border-color: var(--yellow); }\n.tests pre { margin: 6px 0 0; white-space: pre-wrap; font-size: 11px; max-height: 160px; overflow: auto; }\n.spin { display: inline-block; width: 10px; height: 10px; border: 2px solid var(--vscode-descriptionForeground); border-top-color: transparent; border-radius: 50%; animation: spin 0.9s linear infinite; vertical-align: -1px; margin-right: 6px; }\n@keyframes spin { to { transform: rotate(360deg); } }\n</style>\n</head>\n<body>\n<header>\n  <div class=\"title\" id=\"title\">BOB READINESS</div>\n  <div class=\"stats\" id=\"stats\"></div>\n  <div class=\"tabs\" id=\"tabs\"></div>\n</header>\n<main id=\"main\"></main>\n<footer id=\"footer\"></footer>\n<script nonce=\"demo\">\n(function () {\n  const vscode = acquireVsCodeApi();\n  const TABS = [\n    [\"exam\", \"Exam\"], [\"heatmap\", \"Heatmap\"], [\"onboarding\", \"Onboarding\"], [\"review\", \"Review\"], [\"testing\", \"Testing\"], [\"release\", \"Release\"], [\"modernize\", \"Modernize\"],\n  ];\n  let state = null;\n  let draft = \"\";\n\n  const $ = (id) => document.getElementById(id);\n  const esc = (s) => String(s == null ? \"\" : s).replace(/[&<>\"']/g, (c) => ({ \"&\": \"&amp;\", \"<\": \"&lt;\", \">\": \"&gt;\", '\"': \"&quot;\", \"'\": \"&#39;\" }[c]));\n  const post = (msg) => vscode.postMessage(msg);\n\n  // The extension posts { type: \"state\", state } after every change; we re-render everything from it.\n  window.addEventListener(\"message\", (e) => {\n    const m = e.data;\n    if (m && m.type === \"state\") { state = m.state; render(); }\n  });\n\n  function render() {\n    if (!state) return;\n    renderHeader();\n    renderTabs();\n    renderMain();\n    renderFooter();\n  }\n\n  function renderHeader() {\n    const h = state.header;\n    $(\"title\").textContent = \"BOB READINESS: \" + h.repoName.toUpperCase();\n    $(\"stats\").innerHTML =\n      '<div class=\"stat\"><b>' + esc(h.readiness) + '</b><span>' + esc(h.readinessLabel) + '</span></div>' +\n      '<div class=\"stat\"><b>' + esc(h.sureButWrong) + '</b><span>' + esc(h.sureButWrongLabel) + '</span></div>' +\n      '<div class=\"stat\" title=\"' + esc(h.sessionCoins) + ' Bobcoins spent by this extension in this session. The study that produced the context cost ' + esc(h.studyCoins) + ' Bobcoins.\"><b>' + esc(h.sessionCoins) + '</b><span>Bobcoins used</span></div>';\n  }\n\n  function renderTabs() {\n    $(\"tabs\").innerHTML = TABS.map(([id, label]) =>\n      '<button class=\"tab' + (state.activeTab === id ? \" active\" : \"\") + '\" data-tab=\"' + id + '\">' + label + \"</button>\").join(\"\");\n  }\n\n  // The main area shows the active tab, or the Bob run result while a run is in progress.\n  function renderMain() {\n    const main = $(\"main\");\n    if (state.run && state.activeTab !== \"onboarding\" && state.activeTab !== \"release\") { main.innerHTML = renderRun(state.run); return; }\n    switch (state.activeTab) {\n      case \"review\": main.innerHTML = renderFindings(state.tabs.review, \"No review risks in the context file.\"); break;\n      case \"testing\": main.innerHTML = renderFindings(state.tabs.testing, \"No test gaps in the context file.\"); break;\n      case \"modernize\": main.innerHTML = renderFindings(state.tabs.modernize, \"No modernization findings in the context file.\"); break;\n      case \"release\": main.innerHTML = renderRelease(state.release); break;\n      case \"exam\": main.innerHTML = renderExam(state.exam); break;\n      case \"heatmap\": main.innerHTML = renderHeatmap(state.heatmap); break;\n      case \"onboarding\": main.innerHTML = renderOnboarding(state.onboarding); break;\n    }\n    if (state.activeTab === \"onboarding\") {\n      const input = $(\"ask-input\");\n      if (input) { input.value = draft; }\n      const chat = $(\"chat-end\"); if (chat) chat.scrollIntoView({ block: \"end\" });\n    }\n  }\n\n  function renderFindings(rows, emptyText) {\n    if (!state.hasContext) return '<div class=\"empty\">No context file found. Expected .bob/context/readiness.json in the workspace.</div>';\n    if (!rows.length) return '<div class=\"empty\">' + esc(emptyText) + \"</div>\";\n    return rows.map((r) =>\n      '<div class=\"row' + (r.disabled ? \" disabled\" : \"\") + '\">' +\n        '<input type=\"checkbox\" data-id=\"' + esc(r.id) + '\"' + (r.selected ? \" checked\" : \"\") + (r.disabled ? \" disabled\" : \"\") +\n          ' title=\"' + (r.disabled ? \"Needs a person. This finding cannot be sent to Bob.\" : \"Tick to add \" + esc(r.id) + \" to the Bob queue\") + '\">' +\n        '<div class=\"body\">' +\n          '<div class=\"head\"><i class=\"sev ' + r.severity + '\" title=\"' + r.severity + ' severity\"></i><span class=\"ttl\">' + esc(r.title) + \"</span></div>\" +\n          '<div class=\"loc mono\"><a data-open=\"' + esc(r.file) + '\" data-line=\"' + r.line + '\" title=\"' + esc(r.file) + '\">' + esc(r.fileLabel) + '</a><span class=\"fn\">' + esc(r.functionName) + \"</span></div>\" +\n          '<div class=\"detail\">' + esc(r.detail) + \"</div>\" +\n          '<div class=\"rec\">' + esc(r.recommendation) + \"</div>\" +\n          '<span class=\"gate ' + r.gate + '\">' + esc(r.gateLabel) + \"</span>\" +\n        \"</div>\" +\n      \"</div>\").join(\"\");\n  }\n\n  function renderRelease(r) {\n    if (!r) return '<div class=\"empty\">Release data is computed from git. Open a git repository to see it.</div>';\n    if (r.error) return '<div class=\"empty\">' + esc(r.error) + \"</div>\";\n    let html =\n      '<div class=\"kv\"><span>Since tag</span><span class=\"mono\">' + esc(r.sinceLabel) + \"</span></div>\" +\n      '<div class=\"kv\"><span>Commits</span><span>' + r.commitCount + \"</span></div>\" +\n      '<div class=\"kv\"><span>Functions changed</span><span>' + r.changedFunctions.length + \"</span></div>\";\n    html += \"<h3>Readiness of changed files</h3>\";\n    if (!r.changedFiles.length) html += '<div class=\"muted\">No files changed since ' + esc(r.sinceLabel) + \".</div>\";\n    for (const f of r.changedFiles) {\n      const pct = Math.round(f.readiness * 100);\n      const color = f.readiness >= 0.85 ? \"var(--green)\" : f.readiness >= 0.65 ? \"var(--blue)\" : \"var(--red)\";\n      html += '<div class=\"kv\"><a class=\"mono\" data-open=\"' + esc(f.path) + '\" data-line=\"1\">' + esc(f.label) + \"</a><span>\" + (f.known ? pct + \"%\" : \"not studied\") + \"</span></div>\" +\n        '<div class=\"bar\"><i style=\"width:' + (f.known ? pct : 0) + \"%;background:\" + color + '\"></i></div>';\n    }\n    if (r.changedFunctions.length) {\n      html += \"<h3>Changed functions</h3>\";\n      for (const fn of r.changedFunctions) {\n        html += '<div class=\"kv\"><a class=\"mono\" data-open=\"' + esc(fn.file) + '\" data-line=\"' + fn.line + '\">' + esc(fn.name) + \"</a><span>\" + esc(fn.statusLabel) + (fn.tested ? \", tested\" : \", not tested\") + \"</span></div>\";\n      }\n    }\n    html += '<div class=\"verdict ' + r.verdict.kind + '\"><b>' + esc(r.verdict.title) + \"</b>\" + esc(r.verdict.reason) + \"</div>\";\n    html += '<h3>Draft release notes</h3><div class=\"notes\">' + (r.notes.length ? r.notes.map((n) => \"<p>\" + esc(n) + \"</p>\").join(\"\") : '<p class=\"muted\">No commits since ' + esc(r.sinceLabel) + \".</p>\") + \"</div>\";\n    if (r.tests) {\n      html += '<div class=\"tests ' + r.tests.kind + '\"><b>' + esc(r.tests.title) + \"</b> \" + esc(r.tests.summary) + (r.tests.output ? \"<pre>\" + esc(r.tests.output) + \"</pre>\" : \"\") + \"</div>\";\n    }\n    return html;\n  }\n\n  function renderOnboarding(o) {\n    if (!o) return '<div class=\"empty\">No context file found. Expected .bob/context/readiness.json in the workspace.</div>';\n    let html = \"<h3>Set up</h3>\";\n    html += '<pre class=\"code mono\">' + esc(o.setup.join(\"\\n\")) + \"</pre>\";\n    if (o.starterTasks.length) {\n      html += \"<h3>Good first tasks</h3>\";\n      for (const t of o.starterTasks) {\n        html += '<div class=\"card\" data-open=\"' + esc(t.file) + '\" data-line=\"1\"><b>' + esc(t.title) + '</b><span class=\"muted\">' + esc(t.why) + \"</span></div>\";\n      }\n    }\n    html += \"<h3>Ask about this codebase</h3>\";\n    if (o.roles) html += '<div class=\"roles\">' + o.roles.map((r) => '<button data-role=\"' + esc(r.id) + '\"' + (r.id === o.role ? ' class=\"active\"' : \"\") + \">\" + esc(r.label) + \"</button>\").join(\"\") + \"</div>\";\n    html += '<div class=\"chat\">';\n    for (const m of o.messages) {\n      html += '<div class=\"msg q\">' + esc(m.question) + \"</div>\";\n      if (m.pending) html += '<div class=\"msg a\"><span class=\"spin\"></span>Asking Bob...</div>';\n      else html += '<div class=\"msg a\">' + esc(m.answer) + '<span class=\"cost\">' + esc(m.costLabel) + \"</span></div>\";\n    }\n    html += '<div id=\"chat-end\"></div></div>';\n    html += '<div class=\"suggest\">' + o.suggested.map((q) => '<button class=\"btn secondary\" data-ask=\"' + esc(q) + '\">' + esc(q) + \"</button>\").join(\"\") + \"</div>\";\n    html += '<div class=\"ask\"><input id=\"ask-input\" type=\"text\" placeholder=\"Ask a question...\"' + (o.busy ? \" disabled\" : \"\") + '><button class=\"btn\" id=\"ask-btn\" style=\"width:auto\"' + (o.busy ? \" disabled\" : \"\") + \">Ask</button></div>\";\n    html += '<div class=\"notice\">Each new question costs about 1 Bobcoin. Repeated questions are free.</div>';\n    return html;\n  }\n\n  function renderExam(x) {\n    if (!x) return '<div class=\"empty\">No Blindspot report found. Expected results/report_latest.json (or results/sim/report_latest.json for simulated data) in the workspace, or .bob/blindspot/report_latest.json written by \"python cli.py publish\" when the examined repository is open. Run \"python cli.py report\", \"python cli.py simulate\" or \"python cli.py publish\".</div>';\n    let html = \"\";\n    if (x.simulated || x.usingSim) html += '<div class=\"banner\">Simulated data' + (x.usingSim ? \" from results/sim\" : \"\") + '. Not a real Bob run.</div>';\n    if (x.source === \"published\") html += '<div class=\"notice\">Reading the copies that \"python cli.py publish\" wrote into this repository. Publish again to refresh them.</div>';\n    if (x.error) html += '<div class=\"tests fail\"><b>Report problem</b> ' + esc(x.error) + \"</div>\";\n    html += '<div class=\"kv\"><span>Run</span><span class=\"mono\">' + esc(x.run.name) + \"</span></div>\" +\n      '<div class=\"kv\"><span>Condition</span><span>' + esc(x.run.condition) + \", \" + esc(x.run.set) + \" set, repeat \" + x.run.repeat + \"</span></div>\" +\n      '<div class=\"kv\"><span>Generated</span><span>' + esc(x.generatedAt) + \"</span></div>\" +\n      '<div class=\"kv\"><span>Target commit</span><span class=\"mono\">' + esc(x.targetCommit) + \"</span></div>\" +\n      '<div class=\"kv\"><span>Answers</span><span>' + x.counts.scored + \" scored, \" + x.counts.excluded + \" excluded</span></div>\";\n    html += '<h3>Overall</h3><div class=\"grid\">' +\n      stat(x.overall.accuracy, \"accuracy, 95% interval \" + x.overall.interval) +\n      stat(x.overall.cw, \"confidently wrong (\" + x.overall.cwCount + \")\") +\n      stat(x.overall.brier, \"Brier score, lower is better\") +\n      stat(x.overall.ece, \"calibration error (ECE)\") +\n      stat(x.overall.overconfidence, \"overconfidence (stated minus actual)\") +\n      stat(x.overall.meanP, \"mean stated confidence\") + \"</div>\";\n    html += '<h3>Reliability</h3><div class=\"bins\">' + x.reliability.map((b) =>\n      '<div class=\"bin' + (b.n ? \"\" : \" empty\") + '\" title=\"' + esc(b.label) + \": \" + b.n + \" answers\" + (b.accuracy == null ? \"\" : \", accuracy \" + Math.round(b.accuracy * 100) + \"%, stated \" + Math.round(b.meanP * 100) + \"%\") + '\"><i style=\"height:' + (b.accuracy == null ? 0 : Math.max(2, Math.round(b.accuracy * 40))) + 'px\"></i><span>' + esc(b.label.split(\" to \")[0]) + \"</span></div>\").join(\"\") + \"</div>\" +\n      '<div class=\"muted\" style=\"font-size:11px\">Bars: accuracy inside each stated confidence band. Dashed: no answers in that band.</div>';\n    if (x.history.axis.length > 1) {\n      html += \"<h3>Change over time</h3>\" + chart(\"Accuracy\", x.history.accuracy, x) + chart(\"Confidently wrong rate\", x.history.cw, x);\n    } else if (x.history.axis.length === 1) {\n      html += '<h3>Change over time</h3><div class=\"muted\">One report so far (' + esc(x.history.axis[0]) + \"). The chart appears after the next run.</div>\";\n    }\n    html += \"<h3>Modules, worst first</h3>\";\n    if (x.redModules.length) html += '<div class=\"muted\" style=\"margin-bottom:6px\">Red: ' + esc(x.redModules.join(\", \")) + \"</div>\";\n    for (const m of x.modules) {\n      html += '<div class=\"mod\"><div class=\"top\"><i class=\"heat ' + (m.red ? \"hred\" : \"h\" + m.bucket) + '\" title=\"heat ' + m.heat.toFixed(2) + '\"></i>' +\n        '<a data-target=\"' + esc(m.path) + '\" title=\"' + esc(m.path) + '\">' + esc(m.module) + \"</a>\" +\n        (m.red ? '<span class=\"tag red\">red</span>' : \"\") + (m.lowN ? '<span class=\"tag few\">few answers</span>' : \"\") +\n        (m.spark ? '<svg class=\"spark\" width=\"60\" height=\"16\" viewBox=\"0 0 60 16\"><polyline class=\"c1\" points=\"' + m.spark + '\"></polyline></svg>' : \"\") + \"</div>\" +\n        '<div class=\"nums\"><span>accuracy ' + esc(m.accuracy) + \" (\" + esc(m.interval) + \")</span><span>confidently wrong \" + esc(m.cw) + \"</span><span>n \" + m.n + \"</span><span>overconfidence \" + esc(m.overconfidence) + \"</span></div>\" +\n        (m.families.length ? '<div class=\"nums\">' + m.families.map((f) => \"<span>\" + esc(f.name) + \" \" + esc(f.accuracy) + \"</span>\").join(\"\") + \"</div>\" : \"\") +\n        (m.redReasons.length ? '<div class=\"reasons\">' + esc(m.redReasons.join(\"; \")) + \"</div>\" : \"\") + \"</div>\";\n    }\n    if (x.worst.length) {\n      html += \"<h3>Worst functions and classes</h3>\";\n      for (const w of x.worst) {\n        html += '<div class=\"kv\"><a class=\"mono\" data-target=\"' + esc(w.path) + '\" style=\"cursor:pointer;color:var(--blue);text-decoration:none\" title=\"' + esc(w.path) + '\">' + esc(w.entity.split(\":\").pop()) + \"</a><span>\" + esc(w.accuracyLabel) + \" of \" + w.n + \", \" + w.cw_count + \" confidently wrong</span></div>\";\n      }\n    }\n    if (x.runs.length > 1) {\n      const opts = (sel) => x.runs.map((r) => '<option value=\"' + esc(r) + '\"' + (r === sel ? \" selected\" : \"\") + \">\" + esc(r) + \"</option>\").join(\"\");\n      const a = (x.compare && x.compare.a) || x.runs[0];\n      const b = (x.compare && x.compare.b) || x.runs[x.runs.length - 1];\n      html += '<h3>Compare runs</h3><div class=\"selects\"><select id=\"cmp-a\">' + opts(a) + '</select><span>vs</span><select id=\"cmp-b\">' + opts(b) + '</select><button class=\"btn secondary\" id=\"cmp-go\" style=\"width:auto\">Compare</button></div>';\n      if (x.compare) {\n        html += '<table class=\"cmp\"><tr><th>module</th><th>' + esc(x.compare.a) + \"</th><th>\" + esc(x.compare.b) + \"</th><th>change</th></tr>\" +\n          x.compare.rows.map((r) => \"<tr><td>\" + esc(r.label) + (r.redA ? \" (red)\" : \"\") + (r.redB && !r.redA ? \" (now red)\" : \"\") + \"</td><td>\" + esc(r.a) + \"</td><td>\" + esc(r.b) + '</td><td class=\"' + (r.deltaValue > 0 ? \"up\" : r.deltaValue < 0 ? \"down\" : \"\") + '\">' + esc(r.delta) + \"</td></tr>\").join(\"\") + \"</table>\";\n      }\n    }\n    if (x.publish) {\n      html += \"<h3>Publish</h3>\" + (x.publish.running ? '<div class=\"muted\"><span class=\"spin\"></span>Running ' + esc(x.publish.command) + \"</div>\" :\n        '<div class=\"tests ' + (x.publish.ok ? \"\" : \"fail\") + '\"><b>' + (x.publish.ok ? \"Published\" : \"Publish failed\") + \"</b> \" + esc(x.publish.command) + \"<pre>\" + esc(x.publish.output) + \"</pre></div>\");\n    }\n    html += '<div class=\"muted\" style=\"font-size:11px;margin-top:10px\">Reading ' + esc(x.resultsDir) + \"</div>\";\n    return html;\n  }\n  function renderHeatmap(h) {\n    if (!h || (h.runs.rows.length === 0 && h.functions.rows.length === 0)) {\n      return '<div class=\"empty\">No data for a heatmap yet. It fills from results/history.jsonl (files over exam runs) and from .bob/context/readiness.json (functions by file).</div>';\n    }\n    const legend = '<div class=\"legend2\">' + h.legend.map((l, i) => '<span><i class=\"cell b' + i + '\"></i> ' + esc(l) + \"</span>\").join(\"\") + '<span><i class=\"cell b2 red\"></i> red outline: sure but wrong</span><span><i class=\"cell none\"></i> not examined</span></div>';\n    let html = \"\";\n    if (h.runs.rows.length) {\n      html += \"<h3>Files over exam runs</h3>\" + legend + '<div class=\"muted\" style=\"font-size:11px;margin-bottom:6px\">Each column is one exam run, oldest left. Each square is how well Bob knew that file in that run. Hover for numbers, click a file name to open it.</div>';\n      html += '<div class=\"hm\"><table><tr><th></th>' + h.runs.columns.map((c) => '<th class=\"col\" title=\"' + esc(c.run + \", \" + c.when) + '\">' + esc(c.condition) + \"</th>\").join(\"\") + \"</tr>\";\n      for (const r of h.runs.rows) {\n        html += '<tr><td class=\"lbl\"><a data-target=\"' + esc(r.path) + '\" title=\"' + esc(r.path) + '\">' + esc(r.label) + \"</a></td>\" +\n          r.cells.map((c) => c ? '<td><i class=\"cell b' + c.bucket + (c.red ? \" red\" : \"\") + '\" data-target=\"' + esc(r.path) + '\" title=\"' + esc(c.tooltip) + '\"></i></td>' : '<td><i class=\"cell none\" title=\"not examined in this run\"></i></td>').join(\"\") + \"</tr>\";\n      }\n      html += \"</table></div>\";\n    }\n    if (h.functions.rows.length) {\n      const f = h.functions;\n      html += \"<h3>Functions by file</h3>\" + (h.runs.rows.length ? \"\" : legend) +\n        '<div class=\"counts\"><div class=\"stat\"><b>' + f.total + '</b><span>functions studied</span></div><div class=\"stat\"><b>' + f.wrong + '</b><span>sure but wrong</span></div><div class=\"stat\"><b>' + f.part + '</b><span>partly known</span></div><div class=\"stat\"><b>' + f.ok + \"</b><span>known</span></div></div>\" +\n        '<div class=\"muted\" style=\"font-size:11px;margin-bottom:6px\">One square per function, in file order. Click a square to jump to the function. Worst files first.</div>';\n      for (const r of f.rows) {\n        html += '<div class=\"hmrow\"><div class=\"lbl\"><a data-open=\"' + esc(r.path) + '\" data-line=\"1\" title=\"' + esc(r.path) + '\">' + esc(r.label) + \"</a>\" + (r.fileReadiness ? \"<small>\" + esc(r.fileReadiness) + \" ready</small>\" : \"\") + '</div><div class=\"cells\">' +\n          r.cells.map((c) => '<i class=\"cell b' + c.bucket + (c.red ? \" red\" : \"\") + '\" data-open=\"' + esc(r.path) + '\" data-line=\"' + c.line + '\" title=\"' + esc(c.tooltip) + '\"></i>').join(\"\") + \"</div></div>\";\n      }\n    }\n    return html;\n  }\n  function stat(value, label) { return '<div class=\"stat\"><b>' + esc(value) + \"</b><span>\" + esc(label) + \"</span></div>\"; }\n  function chart(title, lines, x) {\n    const w = x.history.width, h = x.history.height;\n    return '<div class=\"chart-wrap\"><div class=\"muted\" style=\"font-size:11px\">' + esc(title) + '</div><svg class=\"chart\" width=\"100%\" height=\"' + h + '\" viewBox=\"0 0 ' + w + \" \" + h + '\" preserveAspectRatio=\"none\">' +\n      '<line x1=\"0\" y1=\"' + (h - 2) + '\" x2=\"' + w + '\" y2=\"' + (h - 2) + '\" stroke=\"var(--vscode-descriptionForeground)\" stroke-width=\"0.5\"></line>' +\n      lines.map((l, i) => '<polyline class=\"c' + (i % 4) + '\" points=\"' + l.points + '\"></polyline>').join(\"\") + \"</svg>\" +\n      '<div class=\"legend\">' + lines.map((l, i) => '<span><i class=\"c' + (i % 4) + '\"></i>' + esc(l.condition) + \"</span>\").join(\"\") + \"<span>\" + esc(x.history.axis[0]) + \" to \" + esc(x.history.axis[x.history.axis.length - 1]) + \"</span></div></div>\";\n  }\n\n  function renderRun(run) {\n    let html = '<div class=\"result\"><h2>' + esc(run.title) + \"</h2>\";\n    html += '<div class=\"kv\"><span>Branch</span><span class=\"mono\" style=\"color:var(--blue)\">' + esc(run.branch) + \"</span></div>\";\n    html += '<div class=\"kv\"><span>Cost</span><span>' + esc(run.costLabel) + \"</span></div>\";\n    if (run.stage) html += '<div class=\"kv muted\"><span><span class=\"spin\"></span>' + esc(run.stage) + \"</span></div>\";\n    html += \"<h3>Changed files</h3>\";\n    if (!run.files.length) html += '<div class=\"muted\">' + (run.stage ? \"Waiting for Bob.\" : \"Bob changed no files.\") + \"</div>\";\n    html += '<div class=\"files\">';\n    for (const f of run.files) {\n      html += '<div class=\"kv\"><a class=\"mono\" data-diff=\"' + esc(f.path) + '\" title=\"Open the diff\">' + esc(f.path) + '</a><span><span class=\"plus\">+' + f.added + '</span><span class=\"minus\">-' + f.removed + \"</span></span></div>\";\n    }\n    html += \"</div>\";\n    if (run.tests) {\n      html += '<div class=\"tests ' + run.tests.kind + '\"><b>' + esc(run.tests.title) + \"</b> \" + esc(run.tests.summary) + (run.tests.output ? \"<pre>\" + esc(run.tests.output) + \"</pre>\" : \"\") + \"</div>\";\n    }\n    if (run.done.length) {\n      html += \"<h3>Done items</h3>\";\n      for (const d of run.done) html += '<div class=\"kv\"><span>' + esc(d) + \"</span></div>\";\n    }\n    if (run.error) html += '<div class=\"tests fail\"><b>Something went wrong</b> ' + esc(run.error) + \"</div>\";\n    html += \"</div>\";\n    return html;\n  }\n\n  function renderFooter() {\n    const f = state.footer;\n    const foot = $(\"footer\");\n    if (state.run && state.activeTab !== \"onboarding\" && state.activeTab !== \"release\") {\n      foot.style.display = \"\";\n      if (state.run.canDecide) {\n        foot.innerHTML = (state.run.files.length ? '<button class=\"btn secondary\" id=\"review-all\" style=\"margin-bottom:8px\">Review all changes</button>' : \"\") +\n          '<div class=\"btns\"><button class=\"btn\" id=\"keep\">Keep changes</button><button class=\"btn secondary\" id=\"discard\">Discard</button></div>';\n      } else if (state.run.error) {\n        foot.innerHTML = '<button class=\"btn secondary\" id=\"dismiss\">Back to findings</button>';\n      } else {\n        foot.innerHTML = '<button class=\"btn secondary\" id=\"cancel\">Cancel</button>';\n      }\n      return;\n    }\n    if (state.activeTab === \"onboarding\" || state.activeTab === \"heatmap\") { foot.style.display = \"none\"; return; }\n    foot.style.display = \"\";\n    if (state.activeTab === \"exam\") {\n      foot.innerHTML = '<div class=\"btns\"><button class=\"btn\" id=\"publish\"' + (!state.exam || (state.exam.publish && state.exam.publish.running) ? \" disabled\" : \"\") + ' title=\"Runs the publish command and shows its output. Never publish while an exam is running.\">Publish context</button>' +\n        '<button class=\"btn secondary\" id=\"reload-report\">Reload report</button></div>';\n      return;\n    }\n    if (state.activeTab === \"release\") {\n      foot.innerHTML = '<button class=\"btn secondary\" id=\"run-tests\"' + (state.release && state.release.tests && state.release.tests.kind === \"running\" ? \" disabled\" : \"\") + \">Run tests</button>\" +\n        '<button class=\"btn secondary\" id=\"copy-notes\">Copy release notes</button>';\n      return;\n    }\n    foot.innerHTML =\n      '<div class=\"totals\"><span>Selected: ' + f.selected + ' (across tabs)</span><span>' + esc(f.coinsText) + \"</span></div>\" +\n      '<button class=\"btn\" id=\"send\"' + (f.canSend ? \"\" : \" disabled\") + \">Send to Bob</button>\";\n  }\n\n  // One delegated click handler: every clickable element carries a data attribute or an id.\n  document.addEventListener(\"click\", (e) => {\n    const t = e.target.closest(\"[data-tab],[data-open],[data-diff],[data-ask],[data-target],[data-role],#send,#keep,#discard,#cancel,#dismiss,#run-tests,#copy-notes,#ask-btn,#publish,#reload-report,#cmp-go,#review-all\");\n    if (!t) return;\n    if (t.dataset.role) { post({ type: \"setRole\", role: t.dataset.role }); return; }\n    if (t.dataset.tab) { post({ type: \"setTab\", tab: t.dataset.tab }); return; }\n    if (t.dataset.target) { post({ type: \"openTargetFile\", file: t.dataset.target }); return; }\n    if (t.dataset.open) { post({ type: \"openFile\", file: t.dataset.open, line: Number(t.dataset.line || 1) }); return; }\n    if (t.dataset.diff) { post({ type: \"openDiff\", file: t.dataset.diff }); return; }\n    if (t.dataset.ask) { post({ type: \"ask\", question: t.dataset.ask }); return; }\n    switch (t.id) {\n      case \"send\": post({ type: \"sendToBob\" }); break;\n      case \"keep\": post({ type: \"keep\" }); break;\n      case \"discard\": post({ type: \"discard\" }); break;\n      case \"cancel\": post({ type: \"cancelRun\" }); break;\n      case \"dismiss\": post({ type: \"dismissRun\" }); break;\n      case \"run-tests\": post({ type: \"runTests\" }); break;\n      case \"copy-notes\": post({ type: \"copyReleaseNotes\" }); break;\n      case \"ask-btn\": ask(); break;\n      case \"publish\": post({ type: \"publish\" }); break;\n      case \"reload-report\": post({ type: \"reloadReport\" }); break;\n      case \"cmp-go\": post({ type: \"compareRuns\", a: $(\"cmp-a\").value, b: $(\"cmp-b\").value }); break;\n      case \"review-all\": post({ type: \"openAllDiffs\" }); break;\n    }\n  });\n  document.addEventListener(\"change\", (e) => {\n    const t = e.target;\n    if (t && t.matches && t.matches(\"input[type=checkbox][data-id]\")) {\n      post({ type: \"toggleFinding\", id: t.dataset.id, selected: t.checked });\n    }\n  });\n  document.addEventListener(\"input\", (e) => {\n    if (e.target && e.target.id === \"ask-input\") draft = e.target.value;\n  });\n  document.addEventListener(\"keydown\", (e) => {\n    if (e.target && e.target.id === \"ask-input\" && e.key === \"Enter\") ask();\n  });\n  function ask() {\n    const q = draft.trim();\n    if (!q) return;\n    draft = \"\";\n    post({ type: \"ask\", question: q });\n  }\n\n  post({ type: \"ready\" });\n})();\n<\/script>\n</body>\n</html>";</script>
<script>/* The web demo's stand-in for the extension host. Everything the real panel asks the extension
   to do (open a file, queue a finding, send to Bob, ask a question, compare runs, publish) is
   answered here with the embedded real data and a scripted fake Bob. No network, no IBM Bob. */
(function () {
  const D = window.DEMO;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pct = (v) => Math.round(v * 100) + "%";

  let run = D.defaultRun;
  let cond = D.conditions[run];
  let activeTab = "review";
  const selected = new Set();
  let sessionCoins = 0;
  let bobRun = null;
  let runTimers = [];
  const onboarding = { messages: [], role: "new", busy: false, cache: {} };
  let releaseTests = null;
  let compare = null;
  let publishState = null;
  let branch = "main";
  let highlightsOn = true;
  let currentFile = null;
  const openTabs = [];
  const inserted = {}; // file -> Map(line -> text), fake Bob's edits shown as inserted lines

  // ---------- panel (the plugin's own webview) ----------
  const frame = $("panel");
  frame.srcdoc = window.PANEL_HTML;
  window.addEventListener("message", (e) => {
    const m = e.data;
    if (m && m.source === "bob-readiness-panel") handle(m.message);
  });
  function postState() {
    if (frame.contentWindow) frame.contentWindow.postMessage({ type: "state", state: buildState() }, "*");
  }

  function chosenFindings() {
    return cond.ctx.findings.filter((f) => selected.has(f.id) && f.bob_allowed !== "no");
  }
  function coinsOf(findings) {
    return Math.round(findings.reduce((s, f) => s + f.estimated_coins, 0) * 100) / 100;
  }
  function buildState() {
    const base = JSON.parse(JSON.stringify(cond.panel));
    for (const tab of ["review", "testing", "modernize"]) for (const r of base.tabs[tab]) r.selected = !r.disabled && selected.has(r.id);
    const chosen = chosenFindings();
    base.footer = { selected: chosen.length, coinsText: "about " + coinsOf(chosen).toFixed(1) + " Bobcoins", canSend: chosen.length > 0 };
    base.header.sessionCoins = sessionCoins.toFixed(1);
    base.activeTab = activeTab;
    base.exam = Object.assign({}, cond.exam, { compare: compare || undefined, publish: publishState || undefined });
    base.heatmap = cond.heatmap;
    base.onboarding = Object.assign({}, cond.onboarding, { messages: onboarding.messages, role: onboarding.role, suggested: D.suggestedByRole[onboarding.role], busy: onboarding.busy });
    base.release = Object.assign({}, cond.release, releaseTests ? { tests: releaseTests } : {});
    base.run = bobRun || undefined;
    return base;
  }

  function handle(msg) {
    if (!msg || typeof msg !== "object") return;
    switch (msg.type) {
      case "ready": postState(); return;
      case "setTab": activeTab = msg.tab; postState(); return;
      case "toggleFinding": toggleFinding(msg.id, msg.selected); return;
      case "openFile": openFile(msg.file, Number(msg.line) || 1); return;
      case "openTargetFile": openFile(msg.file, 1); return;
      case "openDiff": openDiff(msg.file); return;
      case "openAllDiffs": if (bobRun) for (const f of bobRun.files) openDiff(f.path); return;
      case "sendToBob": sendToBob(); return;
      case "keep": keep(); return;
      case "discard": discard(); return;
      case "cancelRun": cancelRun(); return;
      case "dismissRun": if (bobRun && !bobRun.canDecide) { bobRun = null; postState(); } return;
      case "ask": ask(msg.question); return;
      case "setRole": onboarding.role = msg.role; postState(); return;
      case "compareRuns": compareRuns(msg.a, msg.b); return;
      case "publish": publish(); return;
      case "reloadReport": toast("Exam report reloaded from .bob/blindspot/report_latest.json.", "ok"); postState(); return;
      case "runTests": runReleaseTests(); return;
      case "copyReleaseNotes": copy(releaseNotesMarkdown(), "Release notes copied to the clipboard."); return;
      default: return;
    }
  }

  // ---------- queue ----------
  function toggleFinding(id, on) {
    const f = cond.ctx.findings.find((x) => x.id === id);
    if (!f) return;
    if (f.bob_allowed === "no") {
      toast(id + " needs a person. Bob's readiness on " + f.function_id.split("::").pop() + " is too low, so this finding can never be sent to Bob.", "err");
      postState();
      return;
    }
    if (on) selected.add(id); else selected.delete(id);
    postState();
  }

  // ---------- fake Bob: approve, branch, edit, test, keep or discard ----------
  function branchName(d) {
    const p = (n) => String(n).padStart(2, "0");
    return "bob/readiness-" + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + "-" + p(d.getHours()) + p(d.getMinutes());
  }
  function summaryLine(f) {
    return f.id + ": " + f.title + " (" + f.file + ")";
  }
  function sendToBob() {
    if (bobRun) { toast("Bob is already working, or waiting for your Keep or Discard decision."); return; }
    const findings = chosenFindings();
    if (!findings.length) { toast("Nothing selected. Tick findings first."); return; }
    const br = branchName(new Date());
    const files = new Set(findings.map((f) => f.file));
    const coins = coinsOf(findings);
    const detail = [
      "Bob will change " + findings.length + " place" + (findings.length === 1 ? "" : "s") + " in " + files.size + " file" + (files.size === 1 ? "" : "s") + ":",
      ...findings.map((f) => "- " + summaryLine(f)),
      "",
      "Work happens on a new branch " + br + ". Your current branch is not touched.",
      "",
      "Estimated cost: about " + coins.toFixed(1) + " Bobcoins. Session so far " + sessionCoins.toFixed(1) + " of a 2.0 Bobcoin budget.",
      "Fake Bob is on: no real Bobcoins are spent.",
    ].join("\n");
    modal("Send " + findings.length + " change" + (findings.length === 1 ? "" : "s") + " to Bob?", detail, [
      { label: "Approve and run", primary: true, fn: () => startRun(findings, br) },
      { label: "Cancel" },
    ]);
  }
  function startRun(findings, br) {
    branch = br;
    bobRun = { title: "Bob is working", branch: br, costLabel: "0.0 Bobcoins", stage: "Creating branch", files: [], done: [], canDecide: false, _findings: findings };
    renderStatus();
    postState();
    const later = (ms, fn) => runTimers.push(setTimeout(fn, ms));
    later(700, () => { bobRun.stage = "Bob is working"; postState(); });
    later(2600, () => {
      const counts = {};
      for (const f of findings) {
        const fn = cond.ctx.functions.find((x) => x.id === f.function_id);
        if (!fn) continue;
        inserted[f.file] = inserted[f.file] || new Map();
        inserted[f.file].set(fn.line_start, "# fake-bob: reviewed " + f.id + " against .bob/rules/readiness-context.md (" + fn.name + ")");
        counts[f.file] = (counts[f.file] || 0) + 1;
      }
      bobRun.files = Object.keys(counts).map((p) => ({ path: p, added: counts[p], removed: 0 }));
      bobRun.stage = "Running tests";
      bobRun.tests = { kind: "running", title: "Running tests", summary: ".venv/bin/python -m pytest -q" };
      if (currentFile && counts[currentFile]) renderCode(currentFile);
      postState();
    });
    later(4000, () => {
      bobRun.tests = { kind: "pass", title: "Tests passed", summary: "219 passed in 0.52s" };
      bobRun.stage = undefined;
      bobRun.title = "Bob finished";
      bobRun.canDecide = true;
      bobRun.done = findings.map((f) => summaryLine(f) + (f.bob_allowed === "with_notes" ? ", flagged for review" : ""));
      bobRun.done.push("Bob said: Reviewed each listed function against the readiness notes and left a review marker. (scripted fake Bob)");
      runTimers = [];
      postState();
      if (bobRun.files.length) openDiff(bobRun.files[0].path);
    });
  }
  function cancelRun() {
    if (!bobRun || bobRun.canDecide) return;
    for (const t of runTimers) clearTimeout(t);
    runTimers = [];
    revertInserted(bobRun._findings);
    branch = "main";
    bobRun = Object.assign({}, bobRun, { stage: undefined, error: "Cancelled.", canDecide: false, title: "Bob stopped" });
    toast("Bob did not finish: cancelled. Back on main, nothing kept.", "err");
    renderStatus();
    postState();
    if (currentFile) renderCode(currentFile);
  }
  function revertInserted(findings) {
    for (const f of findings || []) if (inserted[f.file]) delete inserted[f.file];
  }
  function keep() {
    if (!bobRun || !bobRun.canDecide) return;
    const r = bobRun;
    const title = "Bob: readiness fixes for " + r._findings.map((f) => f.id).join(", ");
    toast("Kept Bob's changes on " + r.branch + ". Commit: bob: readiness fixes for " + r._findings.map((f) => f.id).join(", "), "ok", [
      { label: "Create pull request", fn: () => modal(title, pullRequestBody(r), [{ label: "Copy to clipboard", primary: true, fn: () => copy(title + "\n\n" + pullRequestBody(r), "Pull request text copied.") }, { label: "Close" }]) },
    ]);
    finishRun();
  }
  function discard() {
    if (!bobRun || !bobRun.canDecide) return;
    revertInserted(bobRun._findings);
    branch = "main";
    toast("Discarded Bob's changes. You are back on main and the branch is deleted.", "ok");
    finishRun();
    if (currentFile) renderCode(currentFile);
  }
  function finishRun() {
    bobRun = null;
    selected.clear();
    renderStatus();
    postState();
  }
  function pullRequestBody(r) {
    return [
      "Branch " + r.branch + " into main. Made by the Bob Readiness plugin after a person approved the items below.",
      "",
      "## Items",
      "| Id | Finding | File | Gate |",
      "|---|---|---|---|",
      ...r._findings.map((f) => "| " + f.id + " | " + f.title + " | " + f.file + " | " + f.bob_allowed + " |"),
      "",
      "## Files",
      ...r.files.map((f) => "- " + f.path + " (+" + f.added + " -" + f.removed + ")"),
      "",
      "## Tests",
      "Passed: " + (r.tests ? r.tests.summary : ""),
      "",
      "Fake Bob: no real Bobcoins were spent. Cost 0.0.",
    ].join("\n");
  }

  // ---------- onboarding chat ----------
  function normalize(q) { return q.toLowerCase().replace(/\s+/g, " ").replace(/[?.!\s]+$/, "").trim(); }
  function ask(q) {
    if (typeof q !== "string" || !q.trim()) return;
    const key = normalize(q);
    if (onboarding.cache[key]) {
      onboarding.messages.push({ question: q, answer: onboarding.cache[key], costLabel: "Answered before, free", pending: false });
      postState();
      return;
    }
    const msg = { question: q, answer: "", costLabel: "", pending: true };
    onboarding.messages.push(msg);
    onboarding.busy = true;
    postState();
    setTimeout(() => {
      msg.answer = cannedAnswer(key);
      msg.costLabel = "Answered by fake Bob, 0.0 Bobcoins";
      msg.pending = false;
      onboarding.cache[key] = msg.answer;
      onboarding.busy = false;
      postState();
    }, 1300);
  }
  function cannedAnswer(q) {
    const ctx = cond.ctx;
    const tail = " (Scripted answer from the demo's fake Bob; the real plugin asks IBM Bob with the study notes as context.)";
    const wrong = ctx.functions.filter((f) => f.status === "wrong").map((f) => f.name);
    const untested = ctx.functions.filter((f) => !f.tested).map((f) => f.name);
    if (/disk|written|write|storage/.test(q)) return "Data reaches disk through the storage layer in tinydb/storages.py. JSONStorage.write serialises the whole database with json.dump and truncates the file; CachingMiddleware in tinydb/middlewares.py holds writes back and flushes when its cache is full, on flush(), or on close(). Note from the readiness file: JSONStorage.close does not itself call write, and JSONStorage.write raises IOError when the file is not writable." + tail;
    if (/quer/.test(q)) return "Queries live in tinydb/queries.py. Query builds a test function by recording attribute access (Query().name == 'x'), and QueryInstance wraps that function with a hashable representation so results can be cached. Operators like ==, <, matches, search, any, all and map return new QueryInstance objects; Query.map exists even though Bob was unsure about it in the exam." + tail;
    if (/read first|start|where.*begin/.test(q)) return "Read tinydb/database.py (TinyDB, which owns tables and the storage), then tinydb/table.py (Table.insert, search, update, upsert), then tinydb/queries.py. Bob's readiness is lowest in tinydb/operations.py and tinydb/__init__.py, so take its answers about those with care." + tail;
    if (/least|understand|wrong before|weak/.test(q)) return "From the exam, the places Bob understands least are: " + (wrong.length ? wrong.join(", ") : "none marked sure but wrong") + ". By file, " + ctx.files.slice().sort((a, b) => a.readiness - b.readiness).slice(0, 2).map((f) => f.path + " at " + pct(f.readiness)).join(" and ") + " score lowest." + tail;
    if (/update/.test(q)) return "Table.update takes fields (a dict or a callable) and optionally cond and doc_ids. With no cond and no doc_ids it updates every document. Table.upsert wraps it and raises ValueError when it cannot decide which documents to touch, which Bob did not know in the C1 exam." + tail;
    if (/test.*storage|storage.*test|cover/.test(q)) return "tests/test_storages.py covers JSONStorage, MemoryStorage and the middleware chain, including read on an empty file, write permissions and encoding. Names from the readiness file that appear under tests/: every studied function except " + (untested.length ? untested.join(", ") : "none") + "." + tail;
    if (/no tests|without tests|untested/.test(q)) return (untested.length ? "Functions in the readiness file whose name appears in no test: " + untested.join(", ") + "." : "Every function in the readiness file is mentioned by at least one test.") + " The Testing tab lists the ones where Bob is also unsure." + tail;
    if (/release notes|mention/.test(q)) return "Since v4.9.0 there is one commit, the demo settings. Nothing in the studied code changed, so the release notes need no Fixed or Added entries. The Release tab has the draft." + tail;
    if (/changed recently|recent/.test(q)) return "No studied function changed since the last tag v4.9.0. The Release tab maps every commit's changed lines onto the functions in the readiness file, so this fills in as soon as something changes." + tail;
    return "This repository is tinydb, a small document database in pure Python. The readiness file says Bob answered " + pct(ctx.summary.readiness) + " of " + ctx.summary.questions + " exam questions correctly and was confidently wrong " + ctx.summary.sure_but_wrong + " times. The corrections are in .bob/rules/readiness-context.md, which Bob loads automatically." + tail;
  }

  // ---------- exam tab: compare, publish; release tab ----------
  function compareRuns(a, b) {
    if (a === b) { toast("Pick two different runs to compare."); return; }
    const rows = D.compares[a + "|" + b];
    if (!rows) { toast("Could not read one of the run reports.", "err"); return; }
    compare = { a, b, rows };
    postState();
  }
  function publish() {
    if (publishState && publishState.running) return;
    const command = '"/Users/aziz/blindspot/.venv/bin/python" cli.py publish --dest "/Users/aziz/blindspot/presentation-tinydb"';
    publishState = { running: true, output: "", command };
    postState();
    setTimeout(() => {
      const newest = "test_C2_r1";
      publishState = {
        running: false, ok: true, command,
        output: ["Published context from " + newest + " into presentation-tinydb:", "  .bob/context/readiness.json", "  .bob/rules/readiness-context.md", "  AGENTS.md", "  .bob/blindspot/report_latest.json", "  .bob/blindspot/history.jsonl", "These files are listed in .git/info/exclude there, so the working tree stays clean for the plugin.", "Exams are not affected: they run in fresh copies with agent files removed.", "(simulated by the web demo)"].join("\n"),
      };
      if (run !== newest) switchRun(newest, true); else postState();
    }, 1400);
  }
  function runReleaseTests() {
    releaseTests = { kind: "running", title: "Running tests", summary: ".venv/bin/python -m pytest -q" };
    postState();
    setTimeout(() => { releaseTests = { kind: "pass", title: "Tests passed", summary: "219 passed in 0.52s" }; postState(); }, 1200);
  }
  function releaseNotesMarkdown() {
    const r = cond.release;
    return ["# Release notes since " + r.sinceLabel, "", ...r.notes.map((n) => "- " + n), "", "Readiness of changed files: no studied file changed."].join("\n");
  }

  // ---------- switching between the two published runs ----------
  function switchRun(to, keepPublish) {
    if (to === run) return;
    const texts = D.changes[run + ">" + to] || [];
    run = to;
    cond = D.conditions[run];
    for (const id of [...selected]) if (!cond.ctx.findings.some((f) => f.id === id)) selected.delete(id);
    compare = null;
    if (!keepPublish) publishState = null;
    renderSwitch();
    renderTree();
    renderStatus();
    if (currentFile) renderCode(currentFile);
    postState();
    for (const t of texts) toast(t, "ok", [{ label: "Open Heatmap", fn: () => { activeTab = "heatmap"; postState(); } }]);
  }
  function renderSwitch() {
    $("switch").innerHTML = D.runs.map((r) => {
      const c = D.conditions[r];
      return '<button data-run="' + r + '"' + (r === run ? ' class="active"' : "") + ' title="Show the plugin as it looks after publishing ' + r + '">' + esc(c.label) + ": " + esc(c.accuracy) + "</button>";
    }).join("");
  }
  $("switch").addEventListener("click", (e) => { const b = e.target.closest("[data-run]"); if (b) switchRun(b.dataset.run); });

  // ---------- Explorer ----------
  function renderTree() {
    const paths = Object.keys(D.files).sort();
    const top = paths.filter((p) => !p.includes("/"));
    const pkg = paths.filter((p) => p.startsWith("tinydb/"));
    const node = (p, depth, isDir) => {
      const t = cond.tree[p];
      const color = t ? t.color : "#c8c8c8";
      const label = isDir ? p : p.split("/").pop();
      return '<div class="node depth' + depth + (isDir ? " dir" : "") + (p === currentFile ? " active" : "") + '" data-path="' + esc(p) + '" data-dir="' + (isDir ? 1 : 0) + '" title="' + esc(t ? t.tooltip : "Not examined") + '" style="color:' + color + '">' +
        '<span class="name">' + esc(label) + "</span>" + (t && t.badge ? '<span class="badge-t">' + esc(t.badge) + "</span>" : "") + "</div>";
    };
    $("tree").innerHTML = node("tinydb", 0, true) + pkg.map((p) => node(p, 1, false)).join("") + top.map((p) => node(p, 0, false)).join("");
  }
  $("tree").addEventListener("click", (e) => {
    const n = e.target.closest("[data-path]");
    if (n && n.dataset.dir !== "1") openFile(n.dataset.path, 1);
  });

  // ---------- editor ----------
  function openFile(file, line) {
    if (!D.files[file]) { toast(file + " is not in this demo (only the examined package is embedded).", "err"); return; }
    currentFile = file;
    if (!openTabs.includes(file)) openTabs.push(file);
    renderTabs();
    renderTree();
    renderCode(file);
    renderStatus();
    scrollTo(line || 1);
  }
  function openDiff(file) {
    const ins = inserted[file];
    openFile(file, ins ? Math.min(...ins.keys()) : 1);
  }
  function renderTabs() {
    $("editor-tabs").innerHTML = openTabs.map((f) => {
      const t = cond.tree[f];
      return '<div class="tab' + (f === currentFile ? " active" : "") + '" data-file="' + esc(f) + '" style="' + (t ? "color:" + t.color : "") + '">' + esc(f.split("/").pop()) + (t && t.badge ? " " + esc(t.badge) : "") + "</div>";
    }).join("");
  }
  $("editor-tabs").addEventListener("click", (e) => { const t = e.target.closest("[data-file]"); if (t) openFile(t.dataset.file, 1); });

  function fnAt(file, line) {
    const fns = cond.ctx.functions.filter((f) => f.file === file && f.line_start <= line && line <= f.line_end);
    return fns.sort((a, b) => (b.line_start - a.line_start))[0]; // innermost
  }
  function renderCode(file) {
    const src = D.files[file].split("\n");
    const findings = cond.ctx.findings.filter((f) => f.file === file);
    const ins = inserted[file];
    let html = "";
    for (let i = 1; i <= src.length; i++) {
      if (ins && ins.has(i)) html += '<div class="line inserted" data-line="' + i + '"><span class="gutter"></span><span class="num">+</span><span class="src">' + esc(indentOf(src[i - 1]) + ins.get(i)) + "</span></div>";
      const fn = highlightsOn ? fnAt(file, i) : undefined;
      const cls = fn && fn.status === "wrong" ? " wrong" : fn && fn.status === "part" ? " part" : "";
      const dot = highlightsOn && findings.some((f) => f.line_start <= i && i <= f.line_end) ? "●" : "";
      const hint = fn && fn.line_start === i && cond.hints[fn.id] ? '<span class="hint">' + esc(cond.hints[fn.id]) + "</span>" : "";
      html += '<div class="line' + cls + '" data-line="' + i + '"><span class="gutter" title="' + (dot ? "Finding on this line" : "") + '">' + dot + '</span><span class="num">' + i + '</span><span class="src">' + esc(src[i - 1]) + "</span>" + hint + "</div>";
    }
    $("code").innerHTML = html;
  }
  function indentOf(s) { return (s.match(/^\s*/) || [""])[0]; }
  function scrollTo(line) {
    const el = $("code").querySelector('.line[data-line="' + line + '"]:not(.inserted)');
    if (!el) return;
    const wrap = $("code-wrap");
    wrap.scrollTop = Math.max(0, el.offsetTop - wrap.clientHeight / 3);
    el.classList.add("flash");
  }
  const card = $("hovercard");
  $("code").addEventListener("mousemove", (e) => {
    const lineEl = e.target.closest(".line");
    if (!lineEl || !currentFile || !highlightsOn) { card.style.display = "none"; return; }
    const line = Number(lineEl.dataset.line);
    const fn = fnAt(currentFile, line);
    const fnd = cond.ctx.findings.filter((f) => f.file === currentFile && f.line_start <= line && line <= f.line_end);
    if (!fn && !fnd.length) { card.style.display = "none"; return; }
    card.innerHTML = hoverHtml(fn, fnd);
    card.style.display = "block";
    const rect = $("code-wrap").getBoundingClientRect();
    card.style.left = Math.min(e.clientX - rect.left + 16, rect.width - 460) + "px";
    card.style.top = Math.min(e.clientY - rect.top + 18, rect.height - card.offsetHeight - 10) + "px";
  });
  $("code").addEventListener("mouseleave", () => { card.style.display = "none"; });
  function hoverHtml(fn, fnd) {
    const statusLabel = { ok: "Bob knows this", part: "Partly known", wrong: "Sure but wrong" };
    const gate = { yes: "Bob can do this", with_notes: "Bob with notes, review needed", no: "Needs a person" };
    let h = "";
    if (fn) {
      h += "<p><b>" + esc(fn.name) + "</b> <span class='muted'>readiness " + pct(fn.readiness) + ", " + statusLabel[fn.status] + (fn.tested ? ", tested" : ", no test mentions it") + "</span></p>";
      for (const m of fn.misconceptions.slice(0, 2)) h += "<p><span class='wrongtxt'>Bob believed (" + pct(m.confidence) + "):</span> " + esc(m.believed) + "<br><span class='truthtxt'>Actually:</span> " + esc(m.truth) + "</p>";
    }
    for (const f of fnd) h += "<p><b>" + esc(f.id) + "</b> " + esc(f.title) + "<br><span class='muted'>" + esc(f.recommendation) + "</span><br><i>" + gate[f.bob_allowed] + "</i>" + (f.bob_allowed !== "no" ? " · tick it in the Review tab" : "") + "</p>";
    return h;
  }

  // ---------- status bar ----------
  function renderStatus() {
    const ctx = cond.ctx;
    const wrongHere = currentFile ? ctx.functions.filter((f) => f.file === currentFile && f.status === "wrong").reduce((n, f) => n + f.misconceptions.filter((m) => m.confidence >= 0.8).length, 0) : 0;
    $("statusbar").innerHTML =
      '<div class="item click" id="toggle-hl" title="Cmd+Alt+R in the IDE: hide and show every highlight">Readiness: ' + (highlightsOn ? "On" : "Off") + "</div>" +
      '<div class="item" title="Overall readiness from the context file, and Bobcoins spent by the plugin this session">' + pct(ctx.summary.readiness) + " readiness · " + sessionCoins.toFixed(1) + " Bobcoins</div>" +
      '<div class="item" title="Exam accuracy and condition from the report">Blindspot ' + esc(cond.exam.overall.accuracy) + " " + esc(cond.condition) + "</div>" +
      (wrongHere ? '<div class="item warn click" id="explain" title="Click to see why">Bob: confidently wrong here ' + wrongHere + " time" + (wrongHere === 1 ? "" : "s") + "</div>" : "") +
      '<div class="item right" title="Nothing on this page calls IBM Bob">fake Bob</div>' +
      '<div class="item branch" title="Git branch of the demo repository">⎇ ' + esc(branch) + "</div>";
  }
  $("statusbar").addEventListener("click", (e) => {
    if (e.target.closest("#toggle-hl")) { highlightsOn = !highlightsOn; renderStatus(); if (currentFile) renderCode(currentFile); }
    if (e.target.closest("#explain") && currentFile) {
      const fns = cond.ctx.functions.filter((f) => f.file === currentFile && f.status === "wrong");
      modal("Why Bob is risky in " + currentFile, fns.map((f) => f.name + ": " + f.misconceptions[0].believed + "\n  Actually: " + f.misconceptions[0].truth).join("\n\n"), [
        { label: "Copy Bob context for this file", primary: true, fn: () => copy(fileContext(currentFile), "Context for " + currentFile + " copied. Paste it into Bob's chat as a preamble.") },
        { label: "Close" },
      ]);
    }
  });
  function fileContext(file) {
    const ctx = cond.ctx;
    const fns = ctx.functions.filter((f) => f.file === file);
    const mod = cond.exam.modules.find((m) => m.path === file);
    return ["Context for " + file + " from Blindspot (exam run " + cond.exam.run.name + ").", mod ? "Exam result for this module (" + mod.module + "): accuracy " + mod.accuracy + ", confidently wrong " + mod.cw + "." : "", "Things you were sure about but got wrong:", ...fns.flatMap((f) => f.misconceptions.map((m) => "- " + f.name + ": you said " + m.believed + " " + m.truth)), "", "Study notes:", cond.notes].join("\n");
  }

  // ---------- toasts, modal, clipboard ----------
  function toast(text, kind, buttons) {
    const el = document.createElement("div");
    el.className = "toast" + (kind ? " " + kind : "");
    el.innerHTML = esc(text) + (buttons && buttons.length ? '<div class="t-btns">' + buttons.map((b, i) => '<button data-i="' + i + '">' + esc(b.label) + "</button>").join("") + "</div>" : "");
    el.addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { const fn = buttons[Number(b.dataset.i)].fn; if (fn) fn(); el.remove(); } });
    $("toasts").appendChild(el);
    setTimeout(() => el.remove(), buttons && buttons.length ? 14000 : 7000);
  }
  function modal(title, detail, buttons) {
    $("modal-title").textContent = title;
    $("modal-detail").textContent = detail;
    $("modal-btns").innerHTML = buttons.map((b, i) => '<button class="' + (b.primary ? "primary" : "secondary") + '" data-i="' + i + '">' + esc(b.label) + "</button>").join("");
    $("modal-btns").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; $("modal-back").hidden = true; const fn = buttons[Number(b.dataset.i)].fn; if (fn) fn(); };
    $("modal-back").hidden = false;
  }
  $("modal-back").addEventListener("click", (e) => { if (e.target === $("modal-back")) $("modal-back").hidden = true; });
  function copy(text, done) {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast(done, "ok"), () => modal("Copy this text", text, [{ label: "Close" }]));
    else modal("Copy this text", text, [{ label: "Close" }]);
  }

  $("repo-link").href = D.repoUrl;
  $("about-link").addEventListener("click", (e) => {
    e.preventDefault();
    modal("What am I looking at?", [
      "This page shows the Bob Readiness plugin for IBM Bob IDE without installing anything.",
      "",
      "Real: every number and every finding. They come from the Blindspot exam that real IBM Bob sat closed book on tinydb v4.9.0: 200 questions, run C1 (Bob's own context) and run C2 (plus Blindspot's notes). The side panel on the right is the plugin's own panel code and the plugin's own state builders, fed with the published readiness context.",
      "",
      "Played: IBM Bob, git and the test run. When you approve a change, a scripted fake Bob edits the shown file, the tests 'pass' and the branch is pretend. No network call is made from this page. In the plugin the same flow spawns headless Bob on a real branch and runs pytest.",
      "",
      "Try: hover the red lines in operations.py; tick F004 and F011 in the Review tab and press Send to Bob; ask a question in Onboarding; press the blue switch at the top to see the same repository after Blindspot's notes were added.",
    ].join("\n"), [{ label: "Close", primary: true }]);
  });

  // ---------- start ----------
  renderSwitch();
  renderTree();
  openFile("tinydb/operations.py", 36);
  renderStatus();
  setTimeout(() => toast("Hover the red lines. Tick F004 and F011 in the Review tab, then Send to Bob. Everything here is the real exam data; only Bob is played.", "ok", [{ label: "What am I looking at?", fn: () => $("about-link").click() }]), 800);
})();
</script>
</body>
</html>
